<!-- Retro top navigation (replaces the Chirpy sidebar) -->
<nav id="retro-topnav" aria-label="Primary navigation">
  <a class="rt-brand" href="{{ '/' | relative_url }}">
    <span class="rt-brand-name">{{ site.title }}</span>
  </a>

  <ul class="rt-links">
    <!-- home -->
    <li class="rt-item{% if page.layout == 'home' %} active{% endif %}">
      <a href="{{ '/' | relative_url }}" class="rt-link">
        <i class="fa-fw fas fa-gamepad"></i><span>HOME</span>
      </a>
    </li>
    <!-- tabs from _tabs (Projects / Tags / Archives / About) -->
    {% for tab in site.tabs %}
      <li class="rt-item{% if tab.url == page.url %} active{% endif %}">
        <a href="{{ tab.url | relative_url }}" class="rt-link">
          <i class="fa-fw {{ tab.icon }}"></i>
          {% capture tab_name %}{{ tab.url | split: '/' }}{% endcapture %}
          <span>{{ site.data.locales[include.lang].tabs.[tab_name] | default: tab.title | upcase }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>

  <a class="rt-resume" href="{{ '/assets/resume/Ankit-Kumar-Resume.pdf' | relative_url }}" target="_blank" rel="noopener">
    <i class="fa-fw fas fa-file-arrow-down"></i><span>RESUME</span>
  </a>
</nav>
