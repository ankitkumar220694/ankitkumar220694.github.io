name: Validate site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-site-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Test landing interactions
        run: node .github/scripts/test-portfolio-landing.js

      - name: Build site
        run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: production

      - name: Test generated routes and links
        run: |
          test -f _site/index.html
          test -f _site/projects/index.html
          grep -q 'href="/projects/"' _site/index.html
          grep -q '<title>Projects | Ankit Kumar' _site/projects/index.html
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Capture rendered homepage and Projects page
        run: |
          mkdir -p visual-evidence
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site > /tmp/portfolio-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          curl --fail --silent http://127.0.0.1:4173/projects/ > /dev/null
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome"
          capture() {
            name="$1"
            size="$2"
            url="$3"
            "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --virtual-time-budget=3000 --window-size="$size" \
              --screenshot="visual-evidence/$name.png" "$url"
          }
          capture home-desktop 1440,900 http://127.0.0.1:4173/
          capture home-mobile 390,844 http://127.0.0.1:4173/
          capture projects-desktop 1440,900 http://127.0.0.1:4173/projects/
          capture projects-mobile 390,844 http://127.0.0.1:4173/projects/

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-evidence
          path: visual-evidence/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload built site for interaction verification
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-built-site
          path: _site
          if-no-files-found: error
          retention-days: 1
