name: Validate site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-site-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Install screenshot harness dependency
        run: python3 -m pip install --disable-pip-version-check websocket-client==1.8.0

      - name: Test source contracts
        run: node .github/scripts/test-site-contracts.js

      - name: Build site
        run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: production

      - name: Test generated routes, assets, and links
        run: |
          required_files=(
            _site/index.html
            _site/projects/index.html
            _site/about/index.html
            _site/tags/index.html
            _site/tags/mlops/index.html
            _site/archives/index.html
            _site/404.html
            _site/posts/welcome/index.html
            _site/posts/designing-a-unified-mlops-framework/index.html
            _site/posts/serving-genai-at-100k-calls-a-day/index.html
            _site/assets/css/retro-game.css
            _site/assets/js/retro-game.js
            _site/assets/css/jekyll-theme-chirpy.css
            _site/assets/resume/Ankit-Kumar-Resume.pdf
            _site/assets/img/game/hd/avatar.png
            _site/assets/img/game/hd/char-determined.png
          )
          for file in "${required_files[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

          assert_contains() {
            local file="$1"
            local text="$2"
            grep -q "$text" "$file" || { echo "Missing '$text' in $file"; exit 1; }
            echo "ok: $file contains '$text'"
          }
          assert_contains _site/index.html 'AI systems that'
          assert_contains _site/index.html 'Explore selected work'
          assert_contains _site/projects/index.html 'Production systems with operational weight'
          assert_contains _site/about/index.html 'I build AI systems that remain useful after launch'
          assert_contains _site/archives/index.html 'Notes from production'
          assert_contains _site/tags/index.html 'Explore by technical signal'
          assert_contains _site/tags/mlops/index.html 'Articles connected to MLOps'
          assert_contains _site/404.html 'This route does not exist'
          assert_contains _site/index.html '/assets/resume/Ankit-Kumar-Resume.pdf'
          assert_contains _data/contact.yml 'type: resume'

          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Capture every public route at exact desktop and mobile viewports
        run: |
          mkdir -p visual-evidence
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site > "$RUNNER_TEMP/portfolio-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done

          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome"
          python3 .github/scripts/capture-routes.py \
            --chrome "$chrome" \
            --base-url http://127.0.0.1:4173 \
            --output-dir visual-evidence

          test "$(find visual-evidence -name '*.png' | wc -l)" -eq 20
          for image in visual-evidence/*.png; do
            bytes="$(stat -c%s "$image")"
            if (( bytes < 20000 )); then
              echo "Suspiciously empty screenshot: $image ($bytes bytes)"
              exit 1
            fi
          done

      - name: Upload pre-deployment visual review
        uses: actions/upload-artifact@v4
        with:
          name: neo-arcade-editorial-review
          path: visual-evidence/*.png
          if-no-files-found: error
          retention-days: 14
