name: Validate site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-site-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Test source contracts (retro-game index)
        run: node .github/scripts/test-portfolio-landing.js

      - name: Build site
        run: bundle exec jekyll build --destination _site
        env:
          JEKYLL_ENV: production

      - name: Test generated routes, controls, and links
        run: |
          required_files=(
            _site/index.html
            _site/projects/index.html
            _site/about/index.html
            _site/tags/index.html
            _site/archives/index.html
            _site/posts/welcome/index.html
            _site/posts/designing-a-unified-mlops-framework/index.html
            _site/posts/serving-genai-at-100k-calls-a-day/index.html
            _site/assets/css/retro-game.css
            _site/assets/js/retro-game.js
            _site/assets/css/jekyll-theme-chirpy.css
            _site/assets/resume/Ankit-Kumar-Resume.pdf
            _site/assets/img/game/char-happy.png
            _site/assets/img/game/hero-walk.png
          )
          for file in "${required_files[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

          # Retro-game index contracts
          grep -q 'PRESS START' _site/index.html
          grep -q 'id="map"' _site/index.html
          grep -q 'char-excited.png' _site/index.html
          grep -q '/assets/resume/Ankit-Kumar-Resume.pdf' _site/index.html
          grep -q 'href="/about/"' _site/index.html
          # Secondary pages still build under Chirpy
          grep -q '<title>Projects | Ankit Kumar' _site/projects/index.html
          grep -q '<title>About | Ankit Kumar' _site/about/index.html
          grep -q 'type: resume' _data/contact.yml

          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Capture all primary routes at desktop and mobile
        run: |
          mkdir -p visual-evidence
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site > "$RUNNER_TEMP/portfolio-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done

          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome"

          capture() {
            local output_name="$1"
            local size="$2"
            local route="$3"
            local url="http://127.0.0.1:4173$route"
            curl --fail --silent "$url" > /dev/null
            "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --disable-smooth-scrolling \
              --force-prefers-reduced-motion --virtual-time-budget=4000 --window-size="$size" \
              --screenshot="visual-evidence/$output_name.png" "$url"
          }

          # Game "world" view: reveal HUD+world by deep-linking a section hash so
          # the boot screen is skipped in the static screenshot.
          sed 's#<section id="boot"#<section id="boot" hidden#; s#<header id="hud" class="hud" hidden#<header id="hud" class="hud"#; s#<main id="world" class="world" hidden#<main id="world" class="world"#' \
            _site/index.html > _site/__world.html

          routes=(
            "boot|/"
            "world|/__world.html"
            "projects|/projects/"
            "about|/about/"
            "tags|/tags/"
            "archives|/archives/"
            "post|/posts/designing-a-unified-mlops-framework/"
          )

          for entry in "${routes[@]}"; do
            route_name="${entry%%|*}"
            route="${entry#*|}"
            capture "$route_name-desktop" 1440,900 "$route"
            capture "$route_name-mobile" 390,844 "$route"
          done

          for image in visual-evidence/*.png; do
            bytes="$(stat -c%s "$image")"
            if (( bytes < 20000 )); then
              echo "Suspiciously empty screenshot: $image ($bytes bytes)"
              exit 1
            fi
          done

          rm -f _site/__world.html

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-evidence
          path: visual-evidence/*.png
          if-no-files-found: error
          retention-days: 7
