<!-- BRIEF: retro telephone handset icon, gold on indigo card with purple frame.
     For portfolio LV-card CONTACT. Classic receiver: two chunky ear/mouth caps
     joined by a downward-bowing bar (dangling handset), plus ring waves.
     Redrawn v2 for clarity at card size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" shape-rendering="crispEdges">
  <rect id="background" x="0" y="0" width="256" height="256" fill="#2b2a6b"/>
  <rect x="4" y="4" width="248" height="248" fill="none" stroke="#8f7bff" stroke-width="8"/>
  <rect x="12" y="12" width="232" height="232" fill="none" stroke="#1a1630" stroke-width="6"/>
  <g id="handset" transform="rotate(-28 128 128)">
    <!-- downward bow connecting the caps -->
    <path d="M78 104 Q128 168 178 104" fill="none" stroke="#ffcf40" stroke-width="26" stroke-linecap="round"/>
    <path d="M78 104 Q128 168 178 104" fill="none" stroke="#1a1630" stroke-width="6"/>
    <!-- earpiece cap (left) -->
    <rect x="58" y="74" width="46" height="40" rx="14" fill="#ffcf40" stroke="#1a1630" stroke-width="6"/>
    <circle cx="81" cy="94" r="8" fill="#1a1630"/>
    <!-- mouthpiece cap (right) -->
    <rect x="152" y="74" width="46" height="40" rx="14" fill="#ffcf40" stroke="#1a1630" stroke-width="6"/>
    <circle cx="175" cy="94" r="8" fill="#1a1630"/>
    <!-- shine -->
    <rect x="64" y="80" width="8" height="10" rx="3" fill="#fff6cf" opacity="0.8"/>
  </g>
  <!-- ring waves top-right -->
  <path d="M198 66 q16 -4 20 12" fill="none" stroke="#8f7bff" stroke-width="7" stroke-linecap="round"/>
  <path d="M208 52 q26 -6 30 20" fill="none" stroke="#8f7bff" stroke-width="7" stroke-linecap="round"/>
</svg>
